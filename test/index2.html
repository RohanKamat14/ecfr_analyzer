<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eCFR Analyzer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>📘 eCFR Analyzer</h1>
    <p>Explore U.S. Federal Regulations by agency, section, and historical trends.</p>
  </header>

  <main>
    <section id="overview">
      <h2>Overview</h2>
      <div class="card">
        <canvas id="wordCountChart"></canvas>
      </div>
    </section>

    <section id="search">
      <h2>Search Regulations</h2>
      <input type="text" id="searchInput" placeholder="Search for terms..." />
      <ul id="searchResults"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
